name: Verificación documental
on: [push, pull_request]
jobs:
  flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ftf
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ftf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ftf -d ftf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ftf:ci_only_password@localhost:5432/ftf_test
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ftf:ci_only_password@localhost:5432/ftf_test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ftf
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ftf_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ftf -d ftf_demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ftf:ci_only_password@localhost:5432/ftf_demo
      APP_URL: http://127.0.0.1:3000
      DEMO_PASSWORD: CI-demostracion-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-results, path: test-results/ }
